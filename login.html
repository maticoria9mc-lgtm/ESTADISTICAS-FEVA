<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCN | Iniciar Sesión</title>
    <style>
        :root {
            --primary: #0f172a; 
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #334155;
            --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: var(--card-bg); padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .login-logo { max-height: 80px; margin-bottom: 20px; }
        h2 { margin-top: 0; color: var(--primary); margin-bottom: 25px; font-size: 1.5rem; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #475569; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: inherit; outline: none; }
        .form-group input:focus { border-color: #3b82f6; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; background: #3b82f6; color: white; margin-top: 10px; }
        .btn:hover { background: #2563eb; }
        .error-msg { color: #b91c1c; font-size: 0.85rem; margin-top: 15px; display: none; background: #fef2f2; padding: 8px; border-radius: 4px; border: 1px solid #fecaca;}
    </style>
</head>
<body>
    <div class="login-container">
        <img src="LOGO INFORMES 2-min.png" alt="MCN Logo" class="login-logo">
        <h2>Acceso al Sistema</h2>
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="emailInput" placeholder="usuario@email.com">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="passwordInput" placeholder="••••••••">
        </div>
        <button id="btnLogin" class="btn">Ingresar</button>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
